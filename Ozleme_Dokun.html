
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Özlem'e Dokun</title>
  <style>
    body {
      margin: 0;
      background: #1e1e1e;
      color: white;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      overflow: hidden;
    }
    .intro {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2em;
      animation: fadeOut 3s forwards;
      z-index: 10;
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    .message {
      font-size: 2em;
      text-align: center;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 1;
    }
    .heart {
      color: red;
      font-size: 3em;
      margin-top: 20px;
      animation: pulse 1s infinite;
      display: none;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body onclick="showMessage()">
  <div class="intro" id="intro">Özlem için başlatılıyor...</div>
  <div class="message" id="message">Seni Seviyorum Özlem</div>
  <div class="heart" id="heart">❤️</div>
  <audio id="bgm" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

  <script>
    const messages = [
      "Seni Seviyorum Özlem",
      "Seninle her şey daha güzel",
      "Gülüşün kalbime huzur",
      "Varlığın bana güç katıyor",
      "Kalbim hep seninle",
      "Birlikte her şey mümkün",
      "Senin için her şeyi yaparım"
    ];

    let currentIndex = 0;

    function showMessage() {
      const msg = document.getElementById('message');
      const heart = document.getElementById('heart');
      const audio = document.getElementById('bgm');

      currentIndex = (currentIndex + 1) % messages.length;
      msg.innerText = messages[currentIndex];
      msg.style.opacity = 1;
      heart.style.display = 'block';
      audio.play();
    }
  </script>
</body>
</html>
